<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Login</title>
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <style>
    body { font-family: Arial, sans-serif; display: grid; place-items: center; min-height: 100vh; }
    .card { width: 320px; border: 1px solid #ddd; padding: 20px; border-radius: 12px; }
    input { width: 100%; padding: 10px; margin: 8px 0; }
    button { width: 100%; padding: 10px; }
    .links { display:flex; gap:10px; margin-top:10px; }
  </style>
</head>
<body>
  <div class="card">
    <h2>Login</h2>
    <input id="username" placeholder="Username" />
    <input id="password" type="password" placeholder="Password" />
    <button onclick="login()">Login</button>
    <p id="msg" style="color:red;"></p>
    <div class="links">
      <a href="test.html">Test</a>
      <a href="admin.html">Admin</a>
      <a href="results.html">Results</a>
    </div>
  </div>

<script>
const scriptURL = "https://script.google.com/macros/s/AKfycbybU7EpOWseHFycGi0mIHjTIA2H83m_UgpWV9VH6hYtUDaKQnYw5oR14nPrcNifydl_/exec";

async function login() {
  const username = document.getElementById('username').value.trim();
  const password = document.getElementById('password').value.trim();
  document.getElementById('msg').textContent = '';

  const res = await fetch(scriptURL, {
    method: 'POST',
    body: JSON.stringify({ action: 'login', username, password })
  });
  const data = await res.json();

  if (data.status === 'success') {
    localStorage.setItem('user', username);
    localStorage.setItem('dept', data.dept);
    localStorage.setItem('role', data.role);
    if (data.role === 'Admin') window.location.href = 'admin.html';
    else window.location.href = 'test.html';
  } else {
    document.getElementById('msg').textContent = 'Invalid login!';
  }
}
</script>
</body>
</html>
