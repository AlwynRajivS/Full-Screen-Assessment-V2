<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Secure Test</title>
  <style>
    body { font-family: Arial, sans-serif; }
    .question { margin-bottom: 20px; }
    .warning { color: red; font-weight: bold; }
  </style>
</head>
<body>
  <h2>Secure Assessment</h2>
  <div id="timer"></div>
  <div id="warnings"></div>
  <div id="questions"></div>
  <button onclick="submitTest()">Submit</button>

<script>
const SCRIPT_URL = "https://script.google.com/macros/s/AKfycby1YwkR-uro5FG5mzU42HJ5kwN3cc6vgt7uDwL3Nht13918CPECN5TnVoDfNQXQQ8EE/exec"; // Replace
const DEPT = "CSE"; // Must match "Dept" column in Sheet

let questions = [];
let violationCount = 0;
let maxViolations = 5;
let timeLeft = 300; // 5 minutes

async function loadQuestions() {
  try {
    const res = await fetch(`${SCRIPT_URL}?dept=${DEPT}`);
    const data = await res.json();
    console.log("Fetched questions:", data); // 🔍 Debug
    questions = data.questions;
    if (!questions || questions.length === 0) {
      document.getElementById("questions").innerHTML = "<p>No questions found.</p>";
    } else {
      showQuestions();
      startTimer();
    }
  } catch (err) {
    console.error("Error loading questions:", err);
    document.getElementById("questions").innerHTML = "<p>Failed to load questions.</p>";
  }
}

function showQuestions() {
  const container = document.getElementById("questions");
  container.innerHTML = "";
  questions.forEach((q, i) => {
    const div = document.createElement("div");
    div.className = "question";
    div.innerHTML = `
      <p><b>Q${i+1}:</b> ${q.question}</p>
      ${q.image ? `<img src="${q.image}" width="200"><br>` : ""}
      ${q.options.map(opt => `
        <label>
          <input type="radio" name="q${i}" value="${opt.text}"> ${opt.text}
        </label><br>
      `).join("")}
    `;
    container.appendChild(div);
  });
}

async function submitTest() {
  // Collect answers
  const answers = {};
  questions.forEach((q, i) => {
    const selected = document.querySelector(`input[name="q${i}"]:checked`);
    answers[`Q${i+1}`] = selected ? selected.value : "Not answered";
  });

  // Prepare payload
  const payload = {
    dept: DEPT,
    answers: answers,
    violations: violationCount,
    timeLeft: timeLeft
  };

  try {
    const res = await fetch(SCRIPT_URL, {
      method: "POST",
      body: JSON.stringify(payload),
      headers: { "Content-Type": "application/json" }
    });
    const result = await res.json();
    alert("Test submitted successfully!");
    console.log("Server response:", result);
  } catch (err) {
    console.error("Error submitting test:", err);
    alert("Failed to submit test. Try again.");
  }
}


function startTimer() {
  const timer = document.getElementById("timer");
  const interval = setInterval(() => {
    if (timeLeft <= 0) {
      clearInterval(interval);
      alert("Time is up! Auto-submit.");
      submitTest();
    } else {
      timer.textContent = "Time Left: " + Math.floor(timeLeft/60) + ":" + (timeLeft%60).toString().padStart(2, "0");
      timeLeft--;
    }
  }, 1000);
}

// Restrict copy/paste and tab switch
function warnViolation(msg) {
  violationCount++;
  const warnBox = document.getElementById("warnings");
  warnBox.innerHTML += `<p class="warning">${msg}. Remaining: ${maxViolations - violationCount}</p>`;
  if (violationCount >= maxViolations) {
    alert("Too many violations! Auto-submit.");
    submitTest();
  }
}

document.addEventListener("copy", e => { e.preventDefault(); warnViolation("Copy not allowed"); });
document.addEventListener("paste", e => { e.preventDefault(); warnViolation("Paste not allowed"); });
document.addEventListener("visibilitychange", () => {
  if (document.hidden) warnViolation("Tab switch not allowed");
});

// Fullscreen on first click
document.addEventListener("click", () => {
  if (!document.fullscreenElement) {
    document.documentElement.requestFullscreen().catch(()=>{});
  }
}, { once: true });

loadQuestions();
</script>
</body>
</html>
